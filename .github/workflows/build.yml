# Builds the game with Unity (issue #23) and deploys it (issue #24):
#   - Pull requests: Windows only, as a quick "does the player build still compile?" check.
#   - Run workflow (manual, any branch): Windows and Web, with downloadable builds. This is how
#     you make a release build, rather than getting one for every merge.
#   - Run workflow on main (with "Deploy" ticked, the default): also publishes the release.
#     The Web build goes live at games.cartergrove.me/match3 and the Windows zip is uploaded
#     for download.
# See Docs/CI.md for how it works, the one-time secrets setup, and timings.
#
# A GitHub Actions *workflow* is a YAML file in .github/workflows/. It says *when* to run (`on:`)
# and *what* to run (`jobs:`). Each job runs on a fresh virtual machine (a "runner") that is
# thrown away afterwards, so anything we want to keep has to be cached or uploaded as an artifact.

name: Build

on:
  pull_request:
    # Only build when something Unity cares about changes. A README edit doesn't need a
    # 15-minute build. The workflow file is listed too, so editing it tests the change.
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build.yml'
  # Building every merge to main is switched off: with lots of small PRs, a Windows + Web build
  # (and ~65 MB of artifacts) per merge isn't worth the minutes. Uncomment to turn it back on.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'Assets/**'
  #     - 'Packages/**'
  #     - 'ProjectSettings/**'
  #     - '.github/workflows/build.yml'
  # Adds a "Run workflow" button on the Actions tab (pick a branch, usually main). This is the
  # way to get Windows + Web builds now.
  workflow_dispatch:
    # Inputs appear as form fields next to the Run workflow button, and the workflow reads them
    # as `inputs.<name>`. Untick this to build main without releasing it, e.g. just to refresh
    # main's Library/ cache. Runs on other branches never deploy, whatever this says.
    inputs:
      deploy:
        description: 'Deploy (main only): Web to games.cartergrove.me/match3, Windows zip to Spaces'
        type: boolean
        default: true

# If you push again to the same PR while a build is still running, cancel the old build:
# only the newest commit's result matters, and it saves CI minutes. Manual builds are never
# cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow's GitHub token only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    # A cold Web build (no Library cache) takes ~55 min, almost all of it IL2CPP compiling C# to
    # C++ and then WebAssembly on a 2-core runner. 90 minutes leaves room without letting a
    # truly stuck build burn minutes forever (GitHub's default limit is 6 hours).
    timeout-minutes: 90

    # A matrix runs this job once per entry, in parallel.
    strategy:
      # Don't cancel the Web build just because the Windows build failed (or vice versa):
      # seeing both results is more useful.
      fail-fast: false
      # Both use GameCI's default build method, which builds the scenes in the build profile's
      # Scene List with the Player Settings saved in ProjectSettings/ProjectSettings.asset.
      # Windows compiles C# with Mono (the Standalone default). Web gets its settings (Gzip,
      # FullWindow template, ...) from that same file: Match3 > Build Web writes them there
      # (Assets/Editor/WebBuild.cs), so after changing WebBuild's settings, run it once and
      # commit ProjectSettings.asset so CI picks them up.
      #
      # Which platforms depends on how the run started. `cond && a || b` is the workflow
      # expression language's if/else, and fromJSON turns the text into a list:
      #   - pull_request: Windows only. A Mono build is cheap (~7-11 min cached) and catches what
      #     unit tests can't, like runtime code using UnityEditor without #if UNITY_EDITOR.
      #     Web (IL2CPP) costs 2-6x as much, so it only runs on demand.
      #   - anything else (Run workflow): Windows and Web.
      matrix:
        targetPlatform: ${{ github.event_name == 'pull_request' && fromJSON('["StandaloneWindows64"]') || fromJSON('["StandaloneWindows64", "WebGL"]') }}

    steps:
      # The Unity Docker images are large (the Web one especially) and the runner starts with
      # only ~14 GB free. Delete some preinstalled SDKs we never use to make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Check out the code, but don't download the Git LFS files (PNGs, fonts) yet.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      # Git LFS bandwidth is limited (1 GB/month on the free plan) and every checkout that
      # downloads LFS files uses it. So we cache the downloaded LFS objects (.git/lfs) and only
      # download again when the set of LFS files changes. The cache key is a hash of the LFS
      # object IDs; computing it in the shell (rather than writing a file for hashFiles())
      # keeps the working tree clean, which unity-builder insists on.
      - name: Hash LFS file list
        id: lfs
        run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.hash }}

      # Replaces the LFS pointer files with the real files, from the cache when possible.
      - name: Git LFS pull
        run: git lfs pull

      # Library/ is Unity's import cache. Rebuilding it from scratch is most of a cold build.
      # The key changes whenever an asset, package or setting changes; on a miss, restore-keys
      # falls back to the newest cache for the same platform, so Unity only re-imports what
      # changed. Each platform gets its own cache because textures import differently per platform.
      - name: Restore Library cache
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      # GameCI's unity-builder runs the Unity Editor headless inside a Docker image
      # (unityci/editor:ubuntu-6000.5.7f1-<platform>-3), picking the version from
      # ProjectSettings/ProjectVersion.txt. It activates the license, builds, and returns the
      # license. A compile error makes Unity exit non-zero, which fails this step and the check.
      #
      # This step gets the Unity credentials, so it's pinned to exact versions: the action to a
      # commit SHA (a tag like @v6 can be moved to different code later) and the game-ci/cli
      # binary it downloads to a release (it would otherwise fetch "latest" on every run).
      # To upgrade, read the release notes and bump both on purpose.
      - name: Build with Unity
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.69
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Match3
          # Output goes to build/<targetPlatform>/, e.g. build/StandaloneWindows64/Match3.exe
          # or build/WebGL/Match3/index.html.
          buildsPath: build

      # Artifacts are files a workflow run keeps after the runner is gone. They show up at the
      # bottom of the run's summary page as downloadable zips. The repo is private, so artifact
      # storage counts against the free quota; a week is plenty to grab a build. PR builds are
      # only a check, so they don't upload anything.
      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Match3-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 7
          if-no-files-found: error

  # Publishes a release (issue #24). The DigitalOcean side (the games hub app, the downloads
  # bucket and its CDN) is created by Terraform in grovecj/cartergrove-me-infra
  # (projects/games/). This job only hands new files to it.
  deploy:
    name: Deploy
    # `needs` makes this job wait for every leg of the build matrix, and it's skipped if any
    # of them failed, so we never publish a Web build without the matching Windows one.
    needs: build
    # Deploy only from a Run workflow on main with the Deploy box ticked. Pull requests never
    # deploy: their event_name is 'pull_request', and they don't get the secrets anyway.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job pushes the web-build branch, so its token needs write access to the repo.
    # Setting `permissions` on a job replaces the workflow-level `contents: read` for this job
    # only; the build jobs, which get the Unity credentials, stay read-only.
    permissions:
      contents: write
    # Names from the infra repo's Terraform outputs (`terraform output` in projects/games/).
    # If the infra changes, update them here.
    env:
      DOWNLOADS_BUCKET: games-downloads                        # downloads_bucket
      SPACES_ENDPOINT: https://nyc3.digitaloceanspaces.com     # downloads_bucket_endpoint
      DOWNLOADS_CDN_URL: https://games-downloads.nyc3.cdn.digitaloceanspaces.com  # downloads_cdn_url
      GAME_URL: https://games.cartergrove.me/match3/           # game_urls["match3"]

    steps:
      # With no `name`, download-artifact fetches every artifact from this run, each into its own
      # folder: artifacts/Match3-WebGL/ and artifacts/Match3-StandaloneWindows64/.
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # App Platform serves the match3 component straight from the web-build branch
      # (deploy_on_push), so updating the live game is just replacing that branch.
      #
      # The branch is a *deploy branch*: one commit holding only the built files, with no history
      # and nothing in common with main. We make a brand-new repo inside the build folder, commit
      # everything, and force-push it over the old branch. Old builds aren't kept (the commit
      # message records which main commit this came from), so the repo doesn't grow ~19 MB per
      # release. GameCI puts the Web build in a subfolder named after buildName, and index.html
      # has to be at the branch root, so that subfolder is what we commit.
      - name: Publish Web build to the web-build branch
        working-directory: artifacts/Match3-WebGL/Match3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f index.html || { echo "::error::index.html not found in the Web build"; ls -R; exit 1; }
          git init --quiet --initial-branch=web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Web build of ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:web-build

      # Spaces speaks the same API as Amazon S3, so the AWS CLI (preinstalled on the runner) can
      # upload to it: point --endpoint-url at Spaces and give it a Spaces access key.
      #
      # The zip is uploaded once under a name with the commit in it, then copied to the "latest"
      # name. The copy happens inside Spaces ("server-side"), so the 49 MB isn't sent twice.
      # The bucket is private (nobody can list it), so each file is made public-read on its own.
      #
      # The *_DoNotShip folder is debug info that Burst writes next to the game; as the name
      # says, it doesn't belong in the download.
      - name: Upload Windows zip to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          # The AWS CLI insists on a region. Spaces ignores it (the endpoint picks the region).
          AWS_DEFAULT_REGION: us-east-1
          # Newer AWS CLIs add checksums that S3-compatible services like Spaces may reject.
          # These turn them back to "only when the request requires it".
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          zip_name="Match3-Windows-${GITHUB_SHA::7}.zip"
          (cd artifacts/Match3-StandaloneWindows64 && zip -r -q "$RUNNER_TEMP/$zip_name" . -x '*_DoNotShip/*')
          aws s3 cp "$RUNNER_TEMP/$zip_name" "s3://$DOWNLOADS_BUCKET/match3/$zip_name" \
            --endpoint-url "$SPACES_ENDPOINT" --acl public-read
          aws s3 cp "s3://$DOWNLOADS_BUCKET/match3/$zip_name" "s3://$DOWNLOADS_BUCKET/match3/Match3-Windows-latest.zip" \
            --endpoint-url "$SPACES_ENDPOINT" --acl public-read
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      # The CDN keeps a copy of each file at its edge servers for an hour (the TTL set in
      # Terraform), so without this, the "latest" link could serve the previous build for up to
      # an hour. Purging (DigitalOcean calls it "flush") makes the edges fetch it again.
      # This uses DigitalOcean's HTTP API directly with curl, and jq to read its JSON:
      #   1. GET /v2/cdn/endpoints lists the CDN endpoints; we find ours by its URL.
      #   2. DELETE /v2/cdn/endpoints/<id>/cache purges the files we name.
      - name: Purge the CDN's copy of the latest zip
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          cdn_host="${DOWNLOADS_CDN_URL#https://}"
          cdn_id=$(curl --fail-with-body -sS -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/cdn/endpoints?per_page=200" \
            | jq -r --arg host "$cdn_host" '.endpoints[] | select(.endpoint == $host) | .id')
          if [ -z "$cdn_id" ]; then
            echo "::error::No CDN endpoint named $cdn_host. Check DOWNLOADS_CDN_URL against the Terraform outputs."
            exit 1
          fi
          curl --fail-with-body -sS -X DELETE -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"files": ["match3/Match3-Windows-latest.zip"]}' \
            "https://api.digitalocean.com/v2/cdn/endpoints/$cdn_id/cache"

      # The job summary is Markdown shown at the top of the run's page.
      - name: Summary
        run: |
          {
            echo "## Deployed ${GITHUB_SHA::7}"
            echo "- **Play:** $GAME_URL (App Platform takes a few minutes to redeploy)"
            echo "- **Windows (latest):** $DOWNLOADS_CDN_URL/match3/Match3-Windows-latest.zip"
            echo "- **Windows (this build):** $DOWNLOADS_CDN_URL/match3/$ZIP_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
