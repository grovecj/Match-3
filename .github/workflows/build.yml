# Builds the game for Windows and the Web on every pull request and every push to main (issue #23).
# See Docs/CI.md for how it works, the one-time Unity license setup, and timings.
#
# A GitHub Actions *workflow* is a YAML file in .github/workflows/. It says *when* to run (`on:`)
# and *what* to run (`jobs:`). Each job runs on a fresh virtual machine (a "runner") that is
# thrown away afterwards, so anything we want to keep has to be cached or uploaded as an artifact.

name: Build

on:
  pull_request:
    # Only build when something Unity cares about changes. A README edit doesn't need a
    # 15-minute build. The workflow file is listed too, so editing it tests the change.
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build.yml'
  # Adds a "Run workflow" button on the Actions tab, handy for re-running a build by hand.
  workflow_dispatch:

# If you push again to the same PR while a build is still running, cancel the old build:
# only the newest commit's result matters, and it saves CI minutes. Builds of main are never
# cancelled, so every merge ends up with its own artifacts.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow's GitHub token only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    # A cold Web build (no Library cache) takes ~55 min, almost all of it IL2CPP compiling C# to
    # C++ and then WebAssembly on a 2-core runner. 90 minutes leaves room without letting a
    # truly stuck build burn minutes forever (GitHub's default limit is 6 hours).
    timeout-minutes: 90

    # A matrix runs this job once per entry, in parallel: one Windows build, one Web build.
    strategy:
      # Don't cancel the Web build just because the Windows build failed (or vice versa):
      # seeing both results is more useful.
      fail-fast: false
      # Both use GameCI's default build method, which builds the scenes in the build profile's
      # Scene List with the Player Settings saved in ProjectSettings/ProjectSettings.asset.
      # Windows compiles C# with Mono (the Standalone default). Web gets its settings (Gzip,
      # FullWindow template, ...) from that same file: Match3 > Build Web writes them there
      # (Assets/Editor/WebBuild.cs), so after changing WebBuild's settings, run it once and
      # commit ProjectSettings.asset so CI picks them up.
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - WebGL

    steps:
      # The Unity Docker images are large (the Web one especially) and the runner starts with
      # only ~14 GB free. Delete some preinstalled SDKs we never use to make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Check out the code, but don't download the Git LFS files (PNGs, fonts) yet.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      # Git LFS bandwidth is limited (1 GB/month on the free plan) and every checkout that
      # downloads LFS files uses it. So we cache the downloaded LFS objects (.git/lfs) and only
      # download again when the set of LFS files changes. The cache key is a hash of the LFS
      # object IDs; computing it in the shell (rather than writing a file for hashFiles())
      # keeps the working tree clean, which unity-builder insists on.
      - name: Hash LFS file list
        id: lfs
        run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.hash }}

      # Replaces the LFS pointer files with the real files, from the cache when possible.
      - name: Git LFS pull
        run: git lfs pull

      # Library/ is Unity's import cache. Rebuilding it from scratch is most of a cold build.
      # The key changes whenever an asset, package or setting changes; on a miss, restore-keys
      # falls back to the newest cache for the same platform, so Unity only re-imports what
      # changed. Each platform gets its own cache because textures import differently per platform.
      - name: Restore Library cache
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      # GameCI's unity-builder runs the Unity Editor headless inside a Docker image
      # (unityci/editor:ubuntu-6000.5.7f1-<platform>-3), picking the version from
      # ProjectSettings/ProjectVersion.txt. It activates the license, builds, and returns the
      # license. A compile error makes Unity exit non-zero, which fails this step and the check.
      #
      # This step gets the Unity credentials, so it's pinned to exact versions: the action to a
      # commit SHA (a tag like @v6 can be moved to different code later) and the game-ci/cli
      # binary it downloads to a release (it would otherwise fetch "latest" on every run).
      # To upgrade, read the release notes and bump both on purpose.
      - name: Build with Unity
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.69
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Match3
          # Output goes to build/<targetPlatform>/, e.g. build/StandaloneWindows64/Match3.exe
          # or build/WebGL/Match3/index.html.
          buildsPath: build

      # Artifacts are files a workflow run keeps after the runner is gone. They show up at the
      # bottom of the run's summary page as downloadable zips. The repo is private, so artifact
      # storage counts against the free quota; a week is plenty to grab a build.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Match3-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 7
          if-no-files-found: error
