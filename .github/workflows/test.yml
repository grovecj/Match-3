# Runs the Edit Mode and Play Mode tests (issue #33), so a PR that breaks a test gets a red check
# before it's merged.
#   - Pull requests: runs when Assets/, Packages/, ProjectSettings/ or this file changes.
#   - Run workflow (manual, any branch): runs the tests on demand, e.g. on main.
# See Docs/CI.md ("Tests") for how it works and how to read the results.
#
# This is a separate workflow from build.yml so it shows up as its own check on the PR ("Test"
# next to "Build"), runs in parallel with the build, and can be re-run on its own. The two share
# the Unity license secrets and the Git LFS cache.

name: Test

on:
  pull_request:
    # Same filter as the build: tests only need to run when something Unity sees changes.
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

# A newer push to the same PR cancels the older test run, like the build does.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Read the repo.
  contents: read
  # unity-test-runner uses the workflow's token to create a "Test Results" check run on the
  # commit, listing each test and annotating failures. Creating check runs needs checks: write.
  checks: write

jobs:
  test:
    name: Test (Edit Mode + Play Mode)
    runs-on: ubuntu-latest
    # A cold run (no Library cache) imports the whole project first, ~30 min like a cold
    # Windows build. Cached runs are much quicker. 60 minutes stops a hung test run early.
    timeout-minutes: 60

    steps:
      # Same as build.yml: the Unity Docker image needs more disk than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      # The LFS steps are copied from build.yml and use the same cache key, so both workflows
      # share one LFS cache (and one download's worth of LFS bandwidth). Tests need the real
      # files because some load real project assets (the token styles and their sprites).
      - name: Hash LFS file list
        id: lfs
        run: echo "hash=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.hash }}

      - name: Git LFS pull
        run: git lfs pull

      # Unity's import cache, as in build.yml. The tests run in the Editor for its default
      # (Linux) target, not Windows or Web, so they get their own "Library-Tests-" cache rather
      # than sharing one that was imported for a different platform.
      - name: Restore Library cache
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Tests-

      # GameCI's unity-test-runner starts the Unity Editor headless in Docker, activates the
      # license, and runs the Test Runner from the command line, the same thing as the
      # `Unity.exe -batchmode -runTests` command in CLAUDE.md. testMode "all" runs Edit Mode and
      # then Play Mode, each writing an NUnit XML results file into artifactsPath.
      #
      # If any test fails (or the code doesn't compile), this step fails, and so does the check.
      # With githubToken set it also adds a "Test Results" check run to the commit: a table of
      # every test, with failures annotated on the lines that failed. That's where to look first.
      #
      # Pinned like unity-builder, because it also receives the Unity credentials: the action to
      # the v4.4.0 commit SHA and the game-ci/cli binary it runs to a release.
      - name: Run tests
        id: tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.69
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ github.token }}
          checkName: Test Results
          # Code coverage needs the com.unity.testtools.codecoverage package, which this project
          # doesn't use, and it's known to crash some Unity versions. Off keeps the run simple.
          coverageEnabled: false

      # Keep the raw XML results even when tests fail (that's when they're most useful):
      # `if: always()` runs this step whatever happened before it. The files are small, and
      # open in any NUnit-aware viewer, or just a text editor.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test-results
          path: test-results
          retention-days: 7
          if-no-files-found: warn
